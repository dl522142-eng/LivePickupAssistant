name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug & Release APKs
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          yes | sdkmanager --licenses || true
          gradle assembleDebug assembleRelease --stacktrace

      - name: Collect Compiled APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/实况取餐助手_v1.0.0_debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/实况取餐助手_v1.0.0_release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 实况取餐助手-APK安装包
          path: dist/*.apk
          if-no-files-found: error
